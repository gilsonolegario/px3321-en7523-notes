<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Zyxel PX3321-T1 — Airoha EN7523 GPON ONT platform notes" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182747"/>
      <stop offset="1" stop-color="#101b33"/>
    </linearGradient>
    <linearGradient id="fiber1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fiber2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.4" fill="#38bdf8"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)" opacity="0.07"/>

  <!-- fiber strands flowing into the chip -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M -10 540 C 300 535 600 430 886 240"  stroke="url(#fiber1)" stroke-width="3"   opacity="0.45"/>
    <path d="M -10 565 C 320 558 620 480 886 310" stroke="url(#fiber1)" stroke-width="3.6" opacity="0.65"/>
    <path d="M -10 590 C 340 584 620 520 886 380" stroke="url(#fiber2)" stroke-width="3.6" opacity="0.65"/>
    <circle cx="360" cy="528" r="5"   fill="#a5f3fc" opacity="0.9"/>
    <circle cx="620" cy="472" r="4.2" fill="#a7f3d0" opacity="0.9"/>
    <circle cx="790" cy="400" r="4.8" fill="#67e8f9" opacity="0.95"/>
  </g>

  <!-- chip -->
  <g>
    <g fill="#334155">
      <rect x="888"  y="210" width="32" height="12" rx="3"/>
      <rect x="888"  y="265" width="32" height="12" rx="3"/>
      <rect x="888"  y="320" width="32" height="12" rx="3"/>
      <rect x="888"  y="375" width="32" height="12" rx="3"/>
      <rect x="1180" y="210" width="32" height="12" rx="3"/>
      <rect x="1180" y="265" width="32" height="12" rx="3"/>
      <rect x="1180" y="320" width="32" height="12" rx="3"/>
      <rect x="1180" y="375" width="32" height="12" rx="3"/>
      <rect x="950"  y="134" width="12" height="34" rx="3"/>
      <rect x="1000" y="134" width="12" height="34" rx="3"/>
      <rect x="1050" y="134" width="12" height="34" rx="3"/>
      <rect x="1100" y="134" width="12" height="34" rx="3"/>
      <rect x="950"  y="452" width="12" height="34" rx="3"/>
      <rect x="1000" y="452" width="12" height="34" rx="3"/>
      <rect x="1050" y="452" width="12" height="34" rx="3"/>
      <rect x="1100" y="452" width="12" height="34" rx="3"/>
    </g>
    <rect x="920" y="170" width="260" height="280" rx="20" fill="url(#chipGrad)" stroke="#3b82f6" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="938" y="188" width="224" height="244" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.2"/>
    <text x="1050" y="295" text-anchor="middle" font-size="46" font-weight="700" fill="#e2e8f0" letter-spacing="1">EN7523</text>
    <text x="1050" y="330" text-anchor="middle" font-size="15" fill="#7dd3fc" letter-spacing="2.5">DUAL CORTEX-A53</text>
    <text x="1050" y="360" text-anchor="middle" font-size="13" fill="#64748b" letter-spacing="3.5">GPON SoC</text>
  </g>

  <!-- headline block -->
  <text x="80" y="150" font-size="17" font-weight="600" fill="#22d3ee" letter-spacing="4">COMMUNITY REVERSE-ENGINEERING NOTES</text>
  <text x="76" y="256" font-size="84" font-weight="800" fill="#f8fafc" letter-spacing="-1">Zyxel PX3321-T1</text>
  <text x="80" y="314" font-size="25" fill="#94a3b8">Airoha EN7523 · GPON ONT · mainline Linux platform documentation</text>

  <!-- topic pills -->
  <g font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="middle">
    <rect x="80"  y="376" width="150" height="38" rx="19" fill="#0f1c33" stroke="#3b4a63"/>
    <text x="155" y="401">GPON · DDMI</text>
    <rect x="238" y="376" width="140" height="38" rx="19" fill="#0f1c33" stroke="#3b4a63"/>
    <text x="308" y="401">HDR2 / FIT</text>
    <rect x="386" y="376" width="160" height="38" rx="19" fill="#0f1c33" stroke="#3b4a63"/>
    <text x="466" y="401">LDDLA · BOSA</text>
    <rect x="554" y="376" width="180" height="38" rx="19" fill="#0f1c33" stroke="#3b4a63"/>
    <text x="644" y="401">MT7916 Wi-Fi 6</text>
  </g>
</svg>
