<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="379" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#334155"/></marker>
  </defs>
  <style>
    .title{font-size:18px;font-weight:bold;fill:#0f172a;text-anchor:middle;stroke:none}
    .lbl{font-size:14px;fill:#0f172a;text-anchor:middle;font-weight:bold;stroke:none}
    .sub{font-size:12px;fill:#334155;text-anchor:middle;stroke:none}
    .pin{font-size:12px;fill:#334155;text-anchor:middle;font-weight:bold;stroke:none}
    .note{font-size:12px;fill:#334155;text-anchor:middle;stroke:none}
    .warn{font-size:13px;fill:#b91c1c;text-anchor:middle;font-weight:bold;stroke:none}
    .arr{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>

  <text class="title" x="340" y="28">UART console — J1 header pinout and wiring</text>
  <rect x="618" y="12" width="122" height="26" rx="13" fill="#dcfce7" stroke="#166534"/>
  <text x="674" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">115200 8N1</text>

  <!-- Physical header strip -->
  <rect x="48" y="46" width="392" height="82" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text class="pin" x="88"  y="60">1</text>
  <text class="pin" x="166" y="60">2</text>
  <text class="pin" x="244" y="60">3</text>
  <text class="pin" x="322" y="60">4</text>
  <text class="pin" x="400" y="60">5</text>

  <rect x="56" y="66" width="64" height="50" rx="6" fill="#ffffff" stroke="#475569"/>
  <text class="lbl" x="88" y="88">GND</text>
  <text class="sub" x="88" y="106">isolated</text>

  <rect x="136" y="66" width="60" height="50" rx="6" fill="#fef3c7" stroke="#b45309" stroke-dasharray="4 3"/>
  <text class="sub" x="166" y="95" font-style="italic" font-weight="bold">empty</text>

  <rect x="212" y="66" width="64" height="50" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text class="lbl" x="244" y="88">TX</text>
  <text class="sub" x="244" y="106">to host</text>

  <rect x="288" y="66" width="68" height="50" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text class="lbl" x="322" y="88">RX</text>
  <text class="sub" x="322" y="106">from host</text>

  <rect x="368" y="66" width="64" height="50" rx="6" fill="#fecaca" stroke="#b91c1c"/>
  <text class="lbl" x="400" y="88" fill="#7f1d1d">VCC</text>
  <text class="sub" x="400" y="106" fill="#7f1d1d">3.3 V</text>

  <text class="sub" x="88"  y="146" font-size="13">physically separated</text>
  <text class="sub" x="166" y="170" font-size="13" font-style="italic">unpopulated slot</text>
  <text class="warn" x="400" y="152">3.3 V ONLY — never 5 V</text>

  <!-- Wiring crossover -->
  <text class="pin" x="140" y="208">PX3321 J1</text>

  <rect x="96" y="216" width="88" height="24" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text class="lbl" x="140" y="233">TX</text>
  <rect x="96" y="246" width="88" height="24" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text class="lbl" x="140" y="263">RX</text>
  <rect x="96" y="276" width="88" height="24" rx="6" fill="#ffffff" stroke="#475569"/>
  <text class="lbl" x="140" y="293">GND</text>

  <rect x="462" y="168" width="272" height="140" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text class="sub" x="598" y="190" font-weight="bold" font-size="14">USB-serial adapter (CH340)</text>
  <text class="sub" x="598" y="206">shows up as /dev/ttyUSB*</text>

  <rect x="482" y="216" width="54" height="24" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text class="lbl" x="509" y="233">TX</text>
  <rect x="482" y="246" width="54" height="24" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text class="lbl" x="509" y="263">RX</text>
  <rect x="482" y="276" width="54" height="24" rx="6" fill="#ffffff" stroke="#475569"/>
  <text class="lbl" x="509" y="293">GND</text>

  <line class="arr" x1="188" y1="228" x2="476" y2="256"/>
  <line class="arr" x1="476" y1="228" x2="188" y2="256"/>
  <line class="arr" x1="188" y1="288" x2="476" y2="288"/>

  <text class="sub" x="333" y="280" font-style="italic">cross TX/RX — a swap costs nothing but silence</text>

  <text class="note" x="380" y="334">VCC is not needed for serial — the adapter is self-powered from USB</text>
  <text class="warn" x="380" y="358">never feed 5 V into any of these pads</text>
</svg>
