<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="329" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#334155"/></marker>
  </defs>
  <style>
    .title{font-size:18px;font-weight:bold;fill:#0f172a;text-anchor:middle;stroke:none}
    .lbl{font-size:14px;fill:#0f172a;text-anchor:middle;font-weight:bold;stroke:none}
    .sub{font-size:12px;fill:#334155;text-anchor:middle;stroke:none}
    .ann{font-size:12px;fill:#334155;stroke:none}
    .warn{font-size:13px;fill:#7f1d1d;text-anchor:middle;stroke:none}
  </style>

  <text class="title" x="380" y="28">RT30xxEEPROM.bin — 208 896 bytes (0x33000)</text>

  <!-- Reference pointer from l1profile.dat -->
  <rect x="40" y="50" width="290" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="lbl" x="185" y="70">/usr/etc/Wireless/l1profile.dat</text>
  <text class="sub" x="185" y="88">INDEX0 · offset 0x0 · size 0x33000</text>
  <line x1="185" y1="98" x2="185" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Bar: scale 208896 B -> 680 px ; 4096 B -> ~13 px -->
  <text class="ann" x="40" y="186">offset 0x0</text>
  <rect x="40" y="162" width="13" height="46" fill="#dcfce7" stroke="#166534"/>
  <rect x="53" y="162" width="667" height="46" fill="#e2e8f0" stroke="#475569"/>
  <!-- tick at 4 KiB -->
  <line x1="53" y1="154" x2="53" y2="216" stroke="#334155" stroke-width="1"/>
  <text class="ann" x="66" y="150">4 KiB</text>

  <!-- Segment labels -->
  <text x="47" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">real</text>
  <text x="47" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">data</text>
  <text class="sub" x="400" y="232">template padding — ~200 KiB reserved (all FF)</text>

  <!-- Red callout -->
  <rect x="60" y="262" width="640" height="52" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text class="warn" x="380" y="283">mainline mt76 precal flag @ 0x19A reads 0 everywhere:</text>
  <text class="warn" x="380" y="302">live flash · full dump · vendor blob — NO precal (cf. OpenWrt PR #14412)</text>

  <!-- MAC note -->
  <text class="ann" x="720" y="152" text-anchor="end">Wi-Fi MAC derives from bytes near offset 5–10</text>
</svg>
