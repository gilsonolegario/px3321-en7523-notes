<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="ui-sans-serif,system-ui,sans-serif">
  <style>
    .p{stroke:#0f172a;stroke-width:1;fill-opacity:1}
    .t{font-size:11px;text-anchor:middle}
    .s{font-size:9px;fill:#334155}
    .hot{fill:#fecaca}
    .note{font-size:10px;fill:#b45309}
  </style>

  <rect class="p" x="20" y="30" width="30" height="40" fill="#e2e8f0"/>
  <text class="t" x="35" y="55">ub</text>
  <rect class="p" x="50" y="30" width="15" height="40" fill="#e2e8f0"/>
  <text class="t" x="57" y="55">rf</text>
  <rect class="p" x="65" y="30" width="22" height="40" fill="#e2e8f0"/>
  <text class="t" x="76" y="55">k</text>
  <rect class="p" x="87" y="30" width="150" height="40" fill="#e2e8f0"/>
  <text class="t" x="162" y="55">rootfs</text>
  <rect class="p" x="237" y="30" width="230" height="40" fill="#e2e8f0"/>
  <text class="t" x="352" y="55">tclinux (primary)</text>
  <rect class="p" x="467" y="30" width="24" height="40" fill="#e2e8f0"/>
  <text class="t" x="479" y="55">ks</text>
  <rect class="p" x="491" y="30" width="26" height="40" fill="#e2e8f0"/>
  <text class="t" x="504" y="55">rs</text>
  <rect class="p" x="517" y="30" width="230" height="40" fill="#dbeafe"/>
  <text class="t" x="632" y="55">tclinux_slave</text>

  <line x1="20" y1="70" x2="740" y2="70" stroke="#94a3b8"/>

  <rect class="p hot" x="20" y="90" width="16" height="40" fill="#fee2e2"/>
  <text class="t" x="28" y="115">wwan</text>
  <rect class="p" x="36" y="90" width="32" height="40" fill="#e2e8f0"/>
  <text class="t" x="52" y="115">data</text>
  <rect class="p hot" x="68" y="90" width="16" height="40" fill="#dcfce7"/>
  <text class="t" x="76" y="115">romd</text>
  <rect class="p" x="84" y="90" width="420" height="40" fill="#e2e8f0"/>
  <text class="t" x="294" y="115">misc (bad-block pool)</text>
  <rect class="p" x="504" y="90" width="18" height="40" fill="#fef3c7"/>
  <text class="t" x="513" y="115">RA</text>

  <text class="s" x="20" y="150">wwan — present but never populated on this SKU (all FF)</text>
  <text class="note" x="20" y="166">rom-d — vendor writes proline backup here during boot on stock</text>
  <text class="s" x="20" y="182">reservearea (RA) — 4KB EEPROM @0x4C000 · BOB laser table @0x140000 · bootflag byte @0x200000</text>
  <text class="s" x="20" y="198">OpenWrt DTS splits tclinux_slave into kernel_slave / rootfs_slave / rootfs_data for mainline use</text>
</svg>
