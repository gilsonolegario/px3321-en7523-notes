<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="309" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <style>
    .title{font-size:18px;font-weight:bold;fill:#0f172a;text-anchor:middle}
    .cell{stroke:#475569;stroke-width:1}
    .in{font-size:14px;fill:#0f172a;text-anchor:middle}
    .ext{font-size:13px;fill:#334155;text-anchor:middle;font-weight:bold}
    .ann{font-size:12px;fill:#334155}
    .tick{stroke:#334155;stroke-width:1}
  </style>

  <text class="title" x="380" y="28">Flash partition map</text>

  <!-- Row 1 -->
  <rect class="cell" x="20"  y="60" width="50"  height="60" fill="#e2e8f0"/>
  <rect class="cell" x="70"  y="60" width="34"  height="60" fill="#e2e8f0"/>
  <rect class="cell" x="104" y="60" width="30"  height="60" fill="#e2e8f0"/>
  <rect class="cell" x="134" y="60" width="130" height="60" fill="#e2e8f0"/>
  <rect class="cell" x="264" y="60" width="210" height="60" fill="#e2e8f0"/>
  <rect class="cell" x="474" y="60" width="30"  height="60" fill="#e2e8f0"/>
  <rect class="cell" x="504" y="60" width="30"  height="60" fill="#e2e8f0"/>
  <rect class="cell" x="534" y="60" width="206" height="60" fill="#dbeafe"/>
  <text class="in" x="45"  y="95">ub</text>
  <text class="in" x="87"  y="95">rf</text>
  <text class="in" x="119" y="95">k</text>
  <text class="in" x="199" y="95">rootfs</text>
  <text class="in" x="369" y="95">tclinux (primary)</text>
  <text class="in" x="489" y="95">ks</text>
  <text class="in" x="519" y="95">rs</text>
  <text class="in" x="637" y="95">tclinux_slave</text>

  <line x1="20" y1="138" x2="740" y2="138" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Row 2 -->
  <rect class="cell" x="20"  y="156" width="23"  height="50" fill="#fee2e2"/>
  <rect class="cell" x="43"  y="156" width="46"  height="50" fill="#e2e8f0"/>
  <rect class="cell" x="89"  y="156" width="23"  height="50" fill="#dcfce7"/>
  <rect class="cell" x="112" y="156" width="602" height="50" fill="#e2e8f0"/>
  <rect class="cell" x="714" y="156" width="26"  height="50" fill="#fef3c7"/>
  <text class="in" x="413" y="186">misc (bad-block pool)</text>
  <text class="ext" x="66"  y="186" font-size="13">data</text>
  <line class="tick" x1="31"  y1="206" x2="31"  y2="214"/>
  <line class="tick" x1="100" y1="206" x2="100" y2="214"/>
  <line class="tick" x1="727" y1="206" x2="727" y2="214"/>
  <text class="ext" x="31"  y="230">wwan</text>
  <text class="ext" x="100" y="230">romd</text>
  <text class="ext" x="727" y="230">RA</text>

  <!-- Annotations tied to rows -->
  <text class="ann" x="20" y="254">wwan unpopulated (all FF) · rom-d: proline backup on stock · RA: EEPROM @0x4C000, BOB table @0x140000, bootflag @0x200000</text>
  <text class="ann" x="20" y="274">OpenWrt DTS splits tclinux_slave into kernel_slave / rootfs_slave / rootfs_data</text>
</svg>
