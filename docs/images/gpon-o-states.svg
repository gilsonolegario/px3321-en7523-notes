<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="319" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .title{font-size:18px;font-weight:bold;fill:#0f172a;text-anchor:middle}
    .box{stroke-width:1.5}
    .idle{fill:#f1f5f9;stroke:#475569}
    .prog{fill:#fef3c7;stroke:#b45309}
    .op{fill:#dcfce7;stroke:#166534}
    .lbl{font-size:14px;fill:#0f172a;text-anchor:middle;font-weight:bold}
    .sub{font-size:12px;fill:#334155;text-anchor:middle}
    .arr{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .band{rx:6;stroke-width:1.5}
    .ok{fill:#dbeafe;stroke:#1d4ed8}
    .miss{fill:#fef3c7;stroke:#b45309}
    .bt{font-size:14px;fill:#0f172a;text-anchor:middle;font-weight:bold}
    .note{font-size:13px;fill:#92400e;font-style:italic;text-anchor:middle}
  </style>

  <text class="title" x="380" y="28">GPON activation states — ITU-T G.984.2</text>

  <!-- state chain -->
  <g class="box idle">
    <rect x="20" y="60" width="132" height="58"/>
    <text class="lbl" x="86" y="84">O1 Initial</text>
    <text class="sub" x="86" y="103">no downstream sync</text>
  </g>

  <g class="box idle">
    <rect x="172" y="60" width="132" height="58"/>
    <text class="lbl" x="238" y="84">O2 Standby</text>
    <text class="sub" x="238" y="103">waiting for serial</text>
  </g>

  <g class="box prog">
    <rect x="324" y="60" width="140" height="58"/>
    <text class="lbl" x="394" y="84">O3 Serial number</text>
    <text class="sub" x="394" y="103">serial sent to OLT</text>
  </g>

  <g class="box prog">
    <rect x="484" y="60" width="126" height="58"/>
    <text class="lbl" x="547" y="84">O4 Ranging</text>
    <text class="sub" x="547" y="103">PLOAM / OMCC</text>
  </g>

  <g class="box op">
    <rect x="630" y="60" width="110" height="58"/>
    <text class="lbl" x="685" y="84">O5 Operation</text>
    <text class="sub" x="685" y="103">traffic flows</text>
  </g>

  <line class="arr" x1="152" y1="89" x2="168" y2="89"/>
  <line class="arr" x1="304" y1="89" x2="320" y2="89"/>
  <line class="arr" x1="464" y1="89" x2="480" y2="89"/>
  <line class="arr" x1="610" y1="89" x2="626" y2="89"/>

  <!-- note -->
  <text class="note" x="380" y="146">identity mismatch ⇒ the OLT ignores you — inject stock serial / registration ID before testing</text>

  <!-- status bands -->
  <g class="band ok">
    <rect x="20" y="170" width="720" height="50"/>
    <text class="bt" x="380" y="191">working today on mainline</text>
    <text class="sub" x="380" y="210">XPON MAC block up · ponInfo populated · DDMI alive</text>
  </g>

  <g class="band miss">
    <rect x="20" y="240" width="720" height="50"/>
    <text class="bt" x="380" y="261">missing</text>
    <text class="sub" x="380" y="280">OMCI daemon provisioning (OLT pushes VLANs / T-CONTs / GEM ports)</text>
  </g>
</svg>
