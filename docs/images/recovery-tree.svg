<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="ui-sans-serif,system-ui,sans-serif">
  <rect x="0.5" y="0.5" width="759" height="429" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .q{fill:#ffffff;stroke:#475569;stroke-width:1.5;rx:6}
    .ok{fill:#dcfce7;stroke:#166534;stroke-width:1.5;rx:6}
    .warn{fill:#fef3c7;stroke:#b45309;stroke-width:1.5;rx:6}
    .alt{fill:#dbeafe;stroke:#1d4ed8;stroke-width:1.5;rx:6}
    .bad{fill:#fecaca;stroke:#b91c1c;stroke-width:1.5;rx:6}
    .lbl{font-size:13px;fill:#0f172a;text-anchor:middle}
    .sub{font-size:10px;fill:#475569;text-anchor:middle}
    .yes{font-size:11px;fill:#166534;font-weight:bold}
    .no{font-size:11px;fill:#b91c1c;font-weight:bold}
    .arr{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>

  <text class="lbl" x="380" y="28">Broken flash — pick your exit</text>

  <!-- Q1 -->
  <g class="q">
    <rect x="290" y="50" width="180" height="44"/>
    <text class="lbl" x="380" y="70">does the system reach preinit?</text>
    <text class="sub" x="380" y="86">failsafe window observed on console</text>
  </g>

  <!-- Q2 -->
  <g class="q">
    <rect x="290" y="140" width="220" height="44"/>
    <text class="lbl" x="380" y="160">serial console wired (UART1 J1)?</text>
    <text class="sub" x="380" y="176">USB-serial adapter at 115200 8N1</text>
  </g>

  <!-- Q3 -->
  <g class="q">
    <rect x="290" y="235" width="180" height="44"/>
    <text class="lbl" x="380" y="255">bootflag sector healthy?</text>
    <text class="sub" x="380" y="271">flag byte readable, no ECC errors</text>
  </g>

  <!-- exits -->
  <g class="ok">
    <rect x="20" y="95" width="230" height="60"/>
    <text class="lbl" x="135" y="113">OpenWrt failsafe</text>
    <text class="sub" x="135" y="122">press [f] during window</text>
<text class="sub" x="135" y="138">mount overlay · fix without flashing</text>
  </g>

  <g class="warn">
    <rect x="520" y="130" width="220" height="64"/>
    <text class="lbl" x="630" y="148">ZHAL rescue</text>
    <text class="sub" x="630" y="163">interrupt zloader countdown · ATSE PX3321-T1 · ATEN password</text>
    <text class="sub" x="630" y="176">ATBT bootflag · ATSW save · ATSR reset</text>
  </g>

  <g class="alt">
    <rect x="520" y="225" width="220" height="64"/>
    <text class="lbl" x="630" y="243">dual-image swap</text>
    <text class="sub" x="630" y="258">flip ASCII flag at reservearea+0x200000,</text>
    <text class="sub" x="630" y="271">boots the other image</text>
  </g>

  <g class="bad">
    <rect x="270" y="330" width="220" height="60"/>
    <text class="lbl" x="380" y="350" fill="#b91c1c">last resort: external SPI-NAND flasher</text>
    <text class="sub" x="380" y="366">clip / soldered flasher, reflash offline — no console needed</text>
  </g>

  <!-- edges -->
  <line class="arr" x1="290" y1="72" x2="254" y2="100"/>
  <text class="yes" x="262" y="80">YES</text>

  <line class="arr" x1="470" y1="72" x2="512" y2="126"/>
  <text class="no" x="484" y="92">NO</text>

  <line class="arr" x1="380" y1="94" x2="380" y2="136"/>
  <text class="no" x="388" y="120">NO</text>

  <line class="arr" x1="470" y1="162" x2="516" y2="162"/>
  <text class="yes" x="486" y="155">YES</text>

  <line class="arr" x1="380" y1="184" x2="380" y2="231"/>
  <text class="no" x="388" y="212">NO</text>

  <line class="arr" x1="470" y1="257" x2="516" y2="257"/>
  <text class="yes" x="486" y="250">YES</text>

  <line class="arr" x1="380" y1="279" x2="380" y2="326"/>
  <text class="no" x="388" y="306">NO</text>

  <!-- legend hint -->
  <text class="sub" x="380" y="415">green = software-only fix · amber = bootloader prompt · blue = flag flip · red = hardware required</text>
</svg>
