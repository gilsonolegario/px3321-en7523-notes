<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="469" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .title{font-size:18px;font-weight:bold;fill:#0f172a;text-anchor:middle;stroke:none}
    .q{fill:#ffffff;stroke:#475569;stroke-width:1.5;rx:6}
    .ok{fill:#dcfce7;stroke:#166534;stroke-width:1.5;rx:6}
    .warn{fill:#fef3c7;stroke:#b45309;stroke-width:1.5;rx:6}
    .alt{fill:#dbeafe;stroke:#1d4ed8;stroke-width:1.5;rx:6}
    .bad{fill:#fecaca;stroke:#b91c1c;stroke-width:1.5;rx:6}
    .lbl{font-size:14px;fill:#0f172a;text-anchor:middle;font-weight:bold;stroke:none}
    .sub{font-size:12px;fill:#334155;text-anchor:middle;stroke:none}
    .yes{font-size:13px;fill:#166534;font-weight:bold;text-anchor:middle;stroke:none}
    .no{font-size:13px;fill:#b91c1c;font-weight:bold;text-anchor:middle;stroke:none}
    .arr{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>

  <text class="title" x="380" y="28">Broken flash — pick your exit</text>

  <!-- Q1 -->
  <g class="q">
    <rect x="260" y="50" width="240" height="52"/>
    <text class="lbl" x="380" y="71">reach preinit?</text>
    <text class="sub" x="380" y="90">failsafe window on console</text>
  </g>

  <!-- Q2 -->
  <g class="q">
    <rect x="260" y="152" width="240" height="52"/>
    <text class="lbl" x="380" y="173">UART1 console wired?</text>
    <text class="sub" x="380" y="192">USB-serial adapter at 115200 8N1</text>
  </g>

  <!-- Q3 -->
  <g class="q">
    <rect x="265" y="254" width="230" height="52"/>
    <text class="lbl" x="380" y="275">bootflag sector healthy?</text>
    <text class="sub" x="380" y="294">flag byte readable, no ECC errors</text>
  </g>

  <!-- exits -->
  <g class="ok">
    <rect x="14" y="100" width="232" height="64"/>
    <text class="lbl" x="130" y="122">OpenWrt failsafe</text>
    <text class="sub" x="130" y="140">press [f] during window</text>
    <text class="sub" x="130" y="156">mount overlay · fix w/o flashing</text>
  </g>

  <g class="warn">
    <rect x="514" y="142" width="232" height="80"/>
    <text class="lbl" x="630" y="164">ZHAL rescue</text>
    <text class="sub" x="630" y="182">interrupt zloader countdown</text>
    <text class="sub" x="630" y="198">ATSE PX3321-T1 · ATEN password</text>
    <text class="sub" x="630" y="214">ATBT flag · ATSW save · ATSR reset</text>
  </g>

  <g class="alt">
    <rect x="514" y="252" width="232" height="64"/>
    <text class="lbl" x="630" y="274">dual-image swap</text>
    <text class="sub" x="630" y="292">flip ASCII flag at</text>
    <text class="sub" x="630" y="308">RA+0x200000 — boots other image</text>
  </g>

  <g class="bad">
    <rect x="240" y="356" width="280" height="64"/>
    <text class="lbl" x="380" y="378" fill="#b91c1c">last resort:</text>
    <text class="lbl" x="380" y="396" fill="#b91c1c">external SPI-NAND flasher</text>
    <text class="sub" x="380" y="412">clip / soldered flasher, offline reflash</text>
  </g>

  <!-- edges -->
  <line class="arr" x1="270" y1="76" x2="244" y2="104"/>
  <text class="yes" x="244" y="82">YES</text>

  <line class="arr" x1="490" y1="76" x2="516" y2="138"/>
  <text class="no" x="512" y="98">NO</text>

  <line class="arr" x1="380" y1="102" x2="380" y2="148"/>
  <text class="no" x="396" y="130">NO</text>

  <line class="arr" x1="500" y1="178" x2="510" y2="178"/>
  <text class="yes" x="505" y="170">YES</text>

  <line class="arr" x1="380" y1="204" x2="380" y2="250"/>
  <text class="no" x="396" y="232">NO</text>

  <line class="arr" x1="500" y1="280" x2="510" y2="280"/>
  <text class="yes" x="505" y="272">YES</text>

  <line class="arr" x1="380" y1="306" x2="380" y2="352"/>
  <text class="no" x="396" y="334">NO</text>

  <!-- legend hint -->
  <text class="sub" x="380" y="452">green = software-only fix · amber = bootloader prompt · blue = flag flip · red = hardware required</text>
</svg>
