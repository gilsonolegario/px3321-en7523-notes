<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="449" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#334155"/></marker>
  </defs>
  <style>
    .title{font-size:18px;font-weight:bold;fill:#0f172a;text-anchor:middle;stroke:none}
    .lbl{font-size:14px;fill:#0f172a;text-anchor:middle;font-weight:bold;stroke:none}
    .sub{font-size:12px;fill:#334155;text-anchor:middle;stroke:none}
    .ann{font-size:12px;fill:#92400e;font-style:italic;text-anchor:middle;stroke:none}
    .bus{font-size:12px;fill:#334155;font-weight:bold;text-anchor:middle;stroke:none}
    .arr{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>

  <text class="title" x="380" y="28">PX3321-T1 hardware block diagram</text>

  <!-- DDR3 -->
  <rect x="20" y="140" width="220" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text class="lbl" x="130" y="164">DDR3-1866 · 512 MiB</text>
  <text class="sub" x="130" y="184">~456 MiB usable after</text>
  <text class="sub" x="130" y="201">ATF/NPU/QDMA reservations</text>
  <text class="ann" x="130" y="240">ATF reserves 256 KiB @0x80000000</text>

  <line class="arr" x1="244" y1="178" x2="276" y2="178"/>

  <!-- SoC -->
  <rect x="282" y="96" width="196" height="200" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="lbl" x="380" y="118">Airoha EN7523</text>
  <rect x="290" y="130" width="180" height="48" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text class="lbl" x="380" y="150">2× Cortex-A53 @ 1 GHz</text>
  <text class="sub" x="380" y="169">ARMv7 (32-bit mode)</text>
  <rect x="290" y="186" width="180" height="34" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text class="sub" x="380" y="208" font-weight="bold">EIP93 crypto engine</text>
  <rect x="290" y="228" width="180" height="34" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text class="sub" x="380" y="250" font-weight="bold">Ethernet MAC</text>

  <!-- Right: switch + LAN -->
  <line class="arr" x1="482" y1="136" x2="516" y2="136"/>
  <rect x="522" y="114" width="218" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text class="lbl" x="631" y="142">MT7530 DSA switch</text>
  <line class="arr" x1="631" y1="160" x2="631" y2="180"/>
  <rect x="551" y="186" width="160" height="38" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text class="lbl" x="631" y="210" fill="#14532d">4× GbE LAN</text>

  <!-- Right: Wi-Fi over PCIe -->
  <line class="arr" x1="482" y1="266" x2="516" y2="266"/>
  <text class="bus" x="499" y="258" font-size="12">PCIe</text>
  <rect x="522" y="234" width="218" height="66" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text class="lbl" x="631" y="256">MT7916 DBDC Wi-Fi 6</text>
  <text class="sub" x="631" y="274">2.4 GHz 2×2 (phy0)</text>
  <text class="sub" x="631" y="291">5 GHz 3×3 (phy1)</text>

  <!-- Bottom buses -->
  <path class="arr" d="M320,296 L320,322 L145,322 L145,348"/>
  <text class="bus" x="232" y="318">i2c0</text>
  <line class="arr" x1="380" y1="296" x2="380" y2="348"/>
  <text class="bus" x="388" y="342" text-anchor="start">SPI-NAND / SNFI</text>
  <path class="arr" d="M440,296 L440,322 L618,322 L618,348"/>
  <text class="bus" x="530" y="318">UART1</text>

  <!-- Bottom row -->
  <rect x="40" y="354" width="210" height="68" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text class="lbl" x="145" y="376">EN7571 LDDLA/BOSA</text>
  <text class="sub" x="145" y="395">GPON optical front-end</text>
  <text class="sub" x="145" y="412">i2c address 0x70</text>

  <rect x="275" y="354" width="210" height="68" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text class="lbl" x="380" y="376">Micron SPI-NAND</text>
  <text class="sub" x="380" y="395">256 MiB · 128 KiB blocks</text>

  <rect x="510" y="354" width="210" height="68" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text class="lbl" x="615" y="376">J1 header (UART1)</text>
  <text class="sub" x="615" y="395">115200 8N1 · 3.3 V</text>
  <text class="sub" x="615" y="412">@ 0x1FBF0000</text>
</svg>
